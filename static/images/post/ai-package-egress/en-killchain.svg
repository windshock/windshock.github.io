<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 300" role="img" aria-label="Eight-CVE kill chain using the package proxy as an escape hatch">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <defs>
    <filter id="kcshe" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity="0.15"/></filter>
    <marker id="kcare" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2157d6"/></marker>
  </defs>

  <rect x="20" y="70" width="210" height="150" rx="16" fill="#eaf1ff" stroke="#9bb8ff" filter="url(#kcshe)"/>
  <text x="125" y="120" text-anchor="middle" font-size="16" font-weight="700" fill="#0f2449">Isolated AI / CI sandbox</text>
  <text x="125" y="148" text-anchor="middle" font-size="12" fill="#334155">only egress =</text>
  <text x="125" y="167" text-anchor="middle" font-size="12" fill="#334155">internal Artifactory proxy</text>

  <path d="M230 145 H263" stroke="#2157d6" stroke-width="4" marker-end="url(#kcare)"/>
  <rect x="265" y="70" width="210" height="150" rx="16" fill="#fff7db" stroke="#f0c24d" filter="url(#kcshe)"/>
  <circle cx="295" cy="100" r="14" fill="#f0c24d"/><text x="295" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#4d3400">1</text>
  <text x="380" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#7c4a03">Egress-break (SSRF)</text>
  <text x="370" y="150" text-anchor="middle" font-size="12" fill="#665200">proxy → arbitrary host</text>
  <text x="370" y="169" text-anchor="middle" font-size="11" fill="#8a6d1f">65924 · 65925 · 65923</text>

  <path d="M475 145 H508" stroke="#2157d6" stroke-width="4" marker-end="url(#kcare)"/>
  <rect x="510" y="70" width="210" height="150" rx="16" fill="#e7f5ff" stroke="#7cc4f0" filter="url(#kcshe)"/>
  <circle cx="540" cy="100" r="14" fill="#7cc4f0"/><text x="540" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#0b3a55">2</text>
  <text x="625" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#0b4a6f">Cloud metadata</text>
  <text x="615" y="150" text-anchor="middle" font-size="12" fill="#12587f">169.254.169.254</text>
  <text x="615" y="169" text-anchor="middle" font-size="11" fill="#2b6f95">→ host IAM credentials</text>

  <path d="M720 145 H753" stroke="#2157d6" stroke-width="4" marker-end="url(#kcare)"/>
  <rect x="755" y="70" width="210" height="150" rx="16" fill="#ffedd5" stroke="#f0a94d" filter="url(#kcshe)"/>
  <circle cx="785" cy="100" r="14" fill="#f0a94d"/><text x="785" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#5b2c02">3</text>
  <text x="870" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#7c3a03">Internal-trust esc.</text>
  <text x="860" y="150" text-anchor="middle" font-size="12" fill="#7c3a03">loopback service → admin</text>
  <text x="860" y="169" text-anchor="middle" font-size="11" fill="#95521f">66014 · 66015</text>

  <path d="M965 145 H998" stroke="#2157d6" stroke-width="4" marker-end="url(#kcare)"/>
  <rect x="1000" y="70" width="210" height="150" rx="16" fill="#ffe5e5" stroke="#f0a0a0" filter="url(#kcshe)"/>
  <circle cx="1030" cy="100" r="14" fill="#e0706f"/><text x="1030" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">4</text>
  <text x="1115" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#8b1a1a">RCE</text>
  <text x="1105" y="150" text-anchor="middle" font-size="12" fill="#8b1a1a">package-service container</text>
  <text x="1105" y="169" text-anchor="middle" font-size="11" fill="#a53a3a">65617 (deserialization)</text>

  <path d="M1210 145 H1243" stroke="#2157d6" stroke-width="4" marker-end="url(#kcare)"/>
  <rect x="1245" y="70" width="215" height="150" rx="16" fill="#eef2f7" stroke="#a9b6c8" filter="url(#kcshe)"/>
  <circle cx="1275" cy="100" r="14" fill="#8595ab"/><text x="1275" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">5</text>
  <text x="1362" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#26364d">Persist · lateral</text>
  <text x="1352" y="150" text-anchor="middle" font-size="12" fill="#3a4a63">file write · secret harvest</text>
  <text x="1352" y="169" text-anchor="middle" font-size="11" fill="#516078">65921 · 66018</text>

  <text x="740" y="258" text-anchor="middle" font-size="13" fill="#475569">From a low bar (65924 needs no auth when Anonymous Access is on), one "allowed package proxy" leads to cloud credentials, the internal network, and RCE.</text>
  <text x="740" y="282" text-anchor="middle" font-size="12" fill="#94a3b8">The "SSRF-to-a-restricted-internal-service" keramas flagged in 2020, realized as a full kill chain in an AI runtime.</text>
</svg>
