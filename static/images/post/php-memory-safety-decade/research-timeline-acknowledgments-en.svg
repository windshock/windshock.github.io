<title id="mainTitle">A Decade of PHP Memory-Safety Research (2016–2026)</title>
<desc id="mainDesc">An English timeline of research on PHP memory safety from 2016 to 2026, followed by four recurring invariants and acknowledgments to discoverers, independent analysts, auditors, fuzzing researchers, core developers, security teams, release maintainers, and supporting organizations. This is a selected, non-exhaustive list.</desc>
