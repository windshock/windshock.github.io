<text x="424" y="664" font-family="Arial,sans-serif" font-size="21.5" font-weight="700" fill="#fff">Failure atomicity</text>
<text x="424" y="693" font-family="Arial,sans-serif" font-size="17.5" fill="#d2e3f2">Do not expose partial state</text>
<text x="424" y="715" font-family="Arial,sans-serif" font-size="17.5" fill="#d2e3f2">after failed initialization.</text>
<line x1="763" y1="590" x2="763" y2="735" stroke="#537597"/>
<circle cx="814" cy="614" r="17" fill="#b7a2ed" opacity=".9"/>
<text x="787" y="664" font-family="Arial,sans-serif" font-size="21.5" font-weight="700" fill="#fff">Re-entrancy safety</text>
<text x="787" y="693" font-family="Arial,sans-serif" font-size="17.5" fill="#d2e3f2">Callbacks must not invalidate</text>
<text x="787" y="715" font-family="Arial,sans-serif" font-size="17.5" fill="#d2e3f2">live engine invariants.</text>
<line x1="1126" y1="590" x2="1126" y2="735" stroke="#537597"/>
<circle cx="1177" cy="614" r="17" fill="#9dc9f7" opacity=".9"/>
<text x="1150" y="664" font-family="Arial,sans-serif" font-size="21.5" font-weight="700" fill="#fff">Recovery after bailout</text>
<text x="1150" y="693" font-family="Arial,sans-serif" font-size="17.5" fill="#d2e3f2">Restore consistency or exit</text>
<text x="1150" y="715" font-family="Arial,sans-serif" font-size="17.5" fill="#d2e3f2">safely after engine errors.</text>
<line x1="1486" y1="590" x2="1486" y2="735" stroke="#537597"/>
<circle cx="1537" cy="614" r="17" fill="#f7c77a" opacity=".9"/>
<text x="1510" y="664" font-family="Arial,sans-serif" font-size="21.5" font-weight="700" fill="#fff">Cross-request ownership</text>
<text x="1510" y="693" font-family="Arial,sans-serif" font-size="17.5" fill="#d2e3f2">Never retain freed request</text>
<text x="1510" y="715" font-family="Arial,sans-serif" font-size="17.5" fill="#d2e3f2">storage in worker state.</text>
