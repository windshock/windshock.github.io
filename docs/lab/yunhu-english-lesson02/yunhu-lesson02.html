<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>윤후 영어 Lesson 02 - 단어를 조각부터 익혀요</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg:#f6f7fb; --card:#ffffff; --ink:#172033; --muted:#667085;
    --line:#d9deea; --accent:#3559d9; --accent-soft:#eef2ff;
    --good:#16794b; --good-soft:#eaf8f1; --bad:#b54708; --bad-soft:#fff4e5;
    --star:#8a6500; --star-soft:#fff7cc;
  }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  body { padding: max(12px, env(safe-area-inset-top)) 12px max(22px, env(safe-area-inset-bottom)); }
  button,input { font:inherit; }
  button { min-height:48px; border-radius:14px; border:1px solid var(--line); background:#fff; color:var(--ink); padding:12px 14px; cursor:pointer; }
  button:active { transform:scale(.99); }
  button:disabled { opacity:.48; cursor:default; transform:none; }
  .app { width:100%; max-width:720px; margin:0 auto; }
  .topbar { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .brand { flex:1; min-width:0; }
  .brand strong { display:block; font-size:17px; }
  .brand span { display:block; color:var(--muted); font-size:13px; margin-top:2px; }
  .mini { min-height:44px; padding:9px 11px; font-size:14px; }
  .download-link { display:flex; align-items:center; justify-content:center; width:100%; min-height:50px; margin-top:12px; border-radius:14px; border:1px solid #cdd5ff; background:#f7f8ff; color:#263f9b; font-weight:800; text-decoration:none; }
  .progress-wrap { margin:8px 0 14px; }
  .progress-line { height:10px; background:#e5e7ef; border-radius:999px; overflow:hidden; }
  .progress-bar { height:100%; width:0; background:var(--accent); border-radius:999px; transition:width .25s ease; }
  .progress-text { margin-top:6px; font-size:13px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:22px; padding:18px; box-shadow:0 5px 18px rgba(24,39,75,.05); }
  .stage { display:inline-flex; align-items:center; gap:6px; padding:7px 10px; border-radius:999px; background:var(--accent-soft); color:#263f9b; font-size:13px; font-weight:700; }
  .emoji { font-size:68px; line-height:1.1; text-align:center; margin:14px 0 8px; }
  h1 { font-size:26px; margin:8px 0; line-height:1.25; }
  h2 { font-size:22px; margin:12px 0 8px; line-height:1.35; }
  p { font-size:18px; line-height:1.55; margin:8px 0; }
  .muted { color:var(--muted); font-size:15px; }
  .korean { font-size:24px; font-weight:800; text-align:center; margin:6px 0 10px; }
  .audio { width:100%; margin:8px 0 14px; background:#f7f8ff; border-color:#cdd5ff; font-weight:700; }
  .choices { display:grid; gap:10px; margin-top:14px; }
  .choice { width:100%; min-height:58px; text-align:left; font-size:20px; font-weight:700; padding:14px 16px; }
  .choice.selected { border:2px solid var(--accent); background:var(--accent-soft); }
  .choice.correct { border:2px solid var(--good); background:var(--good-soft); }
  .choice.wrong { border:2px solid var(--bad); background:var(--bad-soft); }
  .feedback { min-height:54px; margin-top:14px; padding:12px 14px; border-radius:14px; background:#f7f8fa; font-size:16px; line-height:1.45; }
  .feedback.good { background:var(--good-soft); color:#0f5b39; }
  .feedback.try { background:var(--bad-soft); color:#7a3805; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px; }
  .primary { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:800; }
  .star { background:var(--star-soft); border-color:#eadc84; color:#674d00; font-weight:700; }
  .word-line { text-align:center; font-size:34px; letter-spacing:.06em; font-weight:850; margin:18px 0; }
  .input-row { display:flex; gap:10px; align-items:center; margin:14px 0; }
  input[type=text] { width:100%; min-width:0; height:56px; border-radius:14px; border:2px solid #cfd5e3; padding:10px 14px; font-size:22px; text-align:center; text-transform:lowercase; background:#fff; }
  input[type=text]:focus { outline:3px solid rgba(53,89,217,.16); border-color:var(--accent); }
  .chunk-bank, .assembled { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; min-height:62px; padding:10px; border-radius:16px; margin:12px 0; }
  .chunk-bank { background:#f5f6fa; }
  .assembled { background:#fff; border:2px dashed #cbd2df; }
  .chunk { min-width:58px; min-height:50px; font-size:22px; font-weight:800; padding:10px 14px; }
  .chunk-wrap { display:flex; align-items:stretch; gap:6px; }
  .chunk-sound { min-width:48px; min-height:50px; padding:8px 10px; font-size:15px; background:#fff; border-color:#cdd5ff; color:#263f9b; font-weight:750; }
  .chunk-sound small { display:block; font-size:11px; color:var(--muted); margin-top:2px; }
  .phonics-guide { margin:14px 0; padding:14px; border-radius:18px; background:#f8faff; border:1px solid #dbe3ff; }
  .phonics-step-title { font-size:17px; font-weight:850; margin-bottom:10px; }
  .phonics-map { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
  .phonics-card { min-width:0; padding:10px 7px; border:1px solid #d9deea; border-radius:14px; background:#fff; text-align:center; }
  .phonics-grapheme { font-size:25px; font-weight:900; letter-spacing:.03em; }
  .phonics-ipa { font-size:15px; font-weight:800; color:#3559d9; margin-top:2px; }
  .phonics-cue { min-height:38px; font-size:12px; line-height:1.35; color:var(--muted); margin:5px 0 7px; }
  .phonics-play { width:100%; min-height:44px; padding:8px 6px; font-size:14px; font-weight:800; background:#eef2ff; border-color:#cdd5ff; }
  .assembly-title { margin:16px 0 6px; font-size:17px; font-weight:850; }
  @media (max-width:390px) { .phonics-map { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .assembled .chunk { background:var(--accent-soft); border-color:#bec9ff; }
  .sentence { padding:15px; border-radius:16px; background:#f7f8fb; font-size:20px; line-height:1.55; margin:14px 0; }
  .home-grid { display:grid; gap:12px; margin-top:16px; }
  .setbtn { text-align:left; padding:16px; min-height:78px; }
  .setbtn strong { display:block; font-size:19px; margin-bottom:4px; }
  .setbtn span { color:var(--muted); font-size:14px; }
  .note { margin-top:16px; padding:14px; border-radius:16px; background:#fff9e8; border:1px solid #f2df9c; font-size:15px; line-height:1.55; }
  .result-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0; }
  .metric { padding:14px; border-radius:16px; background:#f7f8fb; }
  .metric b { display:block; font-size:24px; margin-top:4px; }
  .summary { white-space:pre-wrap; background:#f6f7fb; border:1px solid var(--line); border-radius:14px; padding:14px; font-size:14px; line-height:1.5; margin-top:12px; }
  .tiny { font-size:13px; color:var(--muted); }
  .hidden { display:none !important; }
  @media (min-width:600px) {
    .card { padding:24px; }
    .home-grid { grid-template-columns:1fr 1fr; }
    .choices { grid-template-columns:1fr 1fr; }
    .choices .choice:last-child:nth-child(odd) { grid-column:1 / -1; }
  }
  @media (max-width:390px) {
    body { padding-left:10px; padding-right:10px; }
    .card { padding:15px; border-radius:18px; }
    .emoji { font-size:58px; }
    h1 { font-size:23px; }
    h2 { font-size:20px; }
    p { font-size:17px; }
    .korean { font-size:22px; }
    .choice { font-size:19px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { scroll-behavior:auto !important; transition:none !important; }
  }
</style>
</head>

  <main id="screen"></main>
</div>

  const PHONICS_BY_LABEL={
    '/k/':['k'], '/oʊ/':['oU'], '/t/':['t'], '/f/':['f'], '/ʊ/':['U'], '/l/':['l'],
    '/iː/':['i_long'], '/mæ/':['m','ae'], '/sk/':['sk'], '/m/':['m'], '/aʊ/':['aU'],
    '/θ/':['theta'], '/peɪ/':['p','eI'], '/pər/':['p','er'], '/pl/':['pl'], '/z/':['z'],
    '/s/':['s'], '/ɔːl/':['O_l'], '/ɛ/':['E'], '/uː/':['u_long']
  };
  const STORAGE='yunhu_lesson02_state_v2';
  const screen=document.getElementById('screen');
  const progressWrap=document.getElementById('progressWrap');
  const progressBar=document.getElementById('progressBar');
  const progressLabel=document.getElementById('progressLabel');
  const stageLabel=document.getElementById('stageLabel');
  const homeBtn=document.getElementById('homeBtn');

  let state=null;
  let cache={};
  let feedbackLocked=false;

  function blankMetrics(){
    const obj={};
    STAGES.forEach(s=>obj[s.id]={correct:0, total:0, hints:0, wrong:0});
    obj.bonus={correct:0,total:0,hints:0,wrong:0};
    return obj;
  }
  function newState(setKey, bonusOnly=false, wordIds=null){
    return {
      setKey,
      wordIds: wordIds || [...SETS[setKey].words],
      stage: bonusOnly ? 4 : 0,
      pos:0,
      mode: bonusOnly ? 'bonus' : 'learn',
      startedAt:Date.now(),
      attempts:0,
      hintsThis:0,
      metrics:blankMetrics(),
      starred:[],
      completed:false
    };
  }
  function save(){ if(state) localStorage.setItem(STORAGE, JSON.stringify(state)); }
  function load(){
    try { return JSON.parse(localStorage.getItem(STORAGE)||'null'); }
    catch(e){ return null; }
  }
  function clearSaved(){ localStorage.removeItem(STORAGE); }
  function shuffle(arr){
    const a=[...arr];
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function esc(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
  function speak(text, rate=.72){
    stopPhonics();
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=rate; u.pitch=1;
    const voices=speechSynthesis.getVoices();
    const preferred=voices.find(v=>/^en-US$/i.test(v.lang) && /Samantha|Ava|Allison|Alex|Google US English/i.test(v.name));
    const en=preferred || voices.find(v=>/^en-US$/i.test(v.lang)) || voices.find(v=>/^en/i.test(v.lang));
    if(en) u.voice=en;
    speechSynthesis.speak(u);
  }
  function markStar(id){
    if(!state.starred.includes(id)) state.starred.push(id);
    save();
  }
  function currentWord(){ return WORDS[state.wordIds[state.pos]]; }
  function stageId(){ return state.mode==='bonus' ? 'bonus' : STAGES[state.stage].id; }
  function totalTasks(){ return state.mode==='bonus' ? state.wordIds.length : state.wordIds.length*STAGES.length; }

    state.metrics[id].wrong += state.attempts;

  let phonicsCtx=null;
  let phonicsSource=null;
  const phonicsBuffers={};
  function stopPhonics(){
    if(phonicsSource){ try{ phonicsSource.stop(); }catch(e){} phonicsSource=null; }
  }
  function phonicsKeys(info){ return PHONICS_BY_LABEL[info?.label] || []; }
  function dataUriToArrayBuffer(uri){
    const b64=uri.split(',')[1]||'';
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return bytes.buffer;
  }
  async function getPhonicsBuffer(key){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) throw new Error('Web Audio unavailable');
    if(!phonicsCtx) phonicsCtx=new AC();
    if(phonicsCtx.state==='suspended') await phonicsCtx.resume();
    if(!PHONICS_AUDIO[key]) throw new Error('Missing phonics audio: '+key);
    if(!phonicsBuffers[key]){
      phonicsBuffers[key]=phonicsCtx.decodeAudioData(dataUriToArrayBuffer(PHONICS_AUDIO[key]));
    }
    return phonicsBuffers[key];
  }
  async function playPhonicsKeys(keys, gap=55){
    if(!keys.length) throw new Error('No phonics key');
    stopPhonics();
    for(const key of keys){
      const buf=await getPhonicsBuffer(key);
      await new Promise(resolve=>{
        const src=phonicsCtx.createBufferSource();
        phonicsSource=src; src.buffer=buf; src.connect(phonicsCtx.destination);
        let done=false;
        const finish=()=>{ if(done)return; done=true; if(phonicsSource===src) phonicsSource=null; resolve(); };
        src.onended=finish;
        src.start(0);
        setTimeout(finish,Math.ceil((buf.duration+0.15)*1000));
      });
      if(gap) await new Promise(r=>setTimeout(r,gap));
    }
  }
  async function playChunkCue(w, idx){
    const info=(w.chunkAudio||[])[idx];
    if(!info) return;
    try{
      await playPhonicsKeys(phonicsKeys(info),25);
      feedback(`<b>${esc(w.chunks[idx])}</b> 철자는 <b>${esc(info.label)}</b> 소리와 연결해요.<br><span>${esc(info.cue||'')}</span>`, '');
    }catch(e){
      feedback('파닉스 소리 파일을 불러오지 못했어요. 새로고침 후 다시 눌러 주세요.','try');
    }
  }
  async function playPhonicsBlend(w){
    try{
      for(let i=0;i<w.chunks.length;i++){
        const info=(w.chunkAudio||[])[i];
        await playPhonicsKeys(phonicsKeys(info),45);
        await new Promise(r=>setTimeout(r,90));
      }
      await new Promise(r=>setTimeout(r,180));
      speak(w.word,.68);
      feedback('<b>조각 소리 → 전체 단어</b> 순서로 들었어요. 이제 같은 순서로 조각을 놓아 보세요.','');
    }catch(e){
      feedback('파닉스 소리 파일을 불러오지 못했어요.','try');
    }
  }
  function drawChunks(w){
    const bank=document.getElementById('bank'), made=document.getElementById('assembled');
    bank.innerHTML=''; made.innerHTML='';
    cache.order.forEach(item=>{
      if(cache.assembled.includes(item.i)) return;
      const wrap=document.createElement('div'); wrap.className='chunk-wrap';
      const b=document.createElement('button'); b.type='button'; b.className='chunk'; b.textContent=item.c;
      b.onclick=()=>{ if(feedbackLocked) return; playChunkCue(w,item.i); cache.assembled.push(item.i); drawChunks(w); checkChunks(w); };
      const audio=document.createElement('button'); audio.type='button'; audio.className='chunk-sound';
      const info=(w.chunkAudio||[])[item.i];
      audio.innerHTML=`🔊<small>${info?esc(info.label):'소리'}</small>`; audio.title='이 철자 조각의 파닉스 소리';
      audio.setAttribute('aria-label', item.c+' 조각 소리 듣기');
      audio.onclick=()=>{ if(feedbackLocked) return; playChunkCue(w,item.i); };
      wrap.appendChild(b); wrap.appendChild(audio); bank.appendChild(wrap);
    });
    cache.assembled.forEach((idx,pos)=>{
      const b=document.createElement('button'); b.type='button'; b.className='chunk'; b.textContent=w.chunks[idx];

      made.appendChild(b);

      <div class="result-grid">
        ${isBonus ? `<div class="metric">첫 시도 전체 철자<b>${metricText(state.metrics.bonus,count)}</b></div><div class="metric">힌트 사용<b>${state.metrics.bonus.hints}회</b></div>` : `
        <div class="metric">뜻 보고 찾기<b>${metricText(state.metrics.recognize,count)}</b></div>
        <div class="metric">철자 조각<b>${metricText(state.metrics.chunks,count)}</b></div>
        <div class="metric">빈칸 철자<b>${metricText(state.metrics.partial,count)}</b></div>
        <div class="metric">문장 뜻→단어 연결<b>${metricText(state.metrics.sentence,count)}</b></div>`}
      </div>
      ${stars.length?`<div class="note">★ 다시 보면 좋은 단어: <b>${stars.map(esc).join(', ')}</b></div>`:'<div class="note">★로 넘긴 단어 없이 끝냈어요.</div>'}
      <div class="summary" id="summary">${esc(summary)}</div>
      <div class="actions"><button id="copyBtn" type="button">📋 결과 복사</button><button id="retryStarBtn" type="button" ${stars.length?'':'disabled'}>★만 다시 연습</button></div>
      ${!isBonus?`<button id="bonusBtn" class="primary" type="button" style="width:100%;margin-top:10px">보너스: 전체 철자 ${count}개 도전</button>`:''}
      <button id="backHome" type="button" style="width:100%;margin-top:10px">세트 선택으로</button>
      <p class="tiny" style="margin-top:12px">부모님은 이 결과에서 ‘첫 시도’, ‘힌트 수’, ‘★ 단어’를 함께 보세요. 전체 철자 쓰기는 실패해도 학습 실패가 아닙니다.</p>
    </section>`;
    document.getElementById('copyBtn').onclick=async()=>{
      try{ await navigator.clipboard.writeText(summary); document.getElementById('copyBtn').textContent='복사했어요 ✓'; }
      catch(e){ const ta=document.createElement('textarea'); ta.value=summary; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); document.getElementById('copyBtn').textContent='복사했어요 ✓'; }
    };
    const retry=document.getElementById('retryStarBtn');
    retry.onclick=()=>{
      const ids=[...new Set(state.starred)]; if(!ids.length) return;
      state=newState(state.setKey,false,ids); clearSaved(); save(); renderTask();
    };
    const bonus=document.getElementById('bonusBtn');
    if(bonus) bonus.onclick=()=>{ const ids=[...state.wordIds]; state=newState(state.setKey,true,ids); clearSaved(); save(); renderTask(); };
    document.getElementById('backHome').onclick=()=>{ clearSaved(); state=null; renderHome(); };
  }
  function renderHome(){
    progressWrap.classList.add('hidden'); homeBtn.classList.add('hidden');
    const old=load(); const canResume=old && !old.completed && old.wordIds && old.wordIds.length;
    screen.innerHTML=`<section class="card">
      <span class="stage">윤후 맞춤 학습</span>
      <h1>한 번에 5개씩, 도움을 조금씩 줄여요.</h1>
      <p>바로 전체 철자를 쓰지 않고 <b>뜻 찾기 → 철자 조각 → 일부 철자 → 문장</b> 순서로 갑니다.</p>
      <div class="home-grid">
        <button class="setbtn" type="button" data-set="A"><strong>A세트 · 오늘 5개</strong><span>${SETS.A.desc}</span></button>
        <button class="setbtn" type="button" data-set="B"><strong>B세트 · 다음 5개</strong><span>${SETS.B.desc}</span></button>
        <button class="setbtn" type="button" data-set="ALL"><strong>전체 복습 · 10개</strong><span>5개씩 해본 뒤 복습할 때 추천</span></button>
        ${canResume?'<button class="setbtn primary" type="button" id="resumeBtn"><strong>이어하기</strong><span>방금 하던 학습부터 계속</span></button>':''}
      </div>
      <div class="note"><b>윤후에게 중요한 규칙</b><br>① 막히면 ★ 하고 넘어가도 돼요.<br>② 힌트를 쓰는 건 실패가 아니에요.<br>③ 전체 철자 쓰기는 마지막 보너스예요.</div>
      <a class="download-link" href="yunhu-lesson02.html" download>⬇️ HTML 파일 다운로드</a>
    </section>`;
    document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{ state=newState(b.dataset.set); clearSaved(); save(); renderTask(); });
    const resume=document.getElementById('resumeBtn'); if(resume) resume.onclick=()=>{ state=old; renderTask(); };
  }
  homeBtn.onclick=()=>{
    const ok=confirm('학습을 멈추고 세트 선택 화면으로 갈까요? 지금 진행은 저장되어 있어요.');
    if(ok) renderHome();
  };
  renderHome();
})();
</script>
</body>
</html>
