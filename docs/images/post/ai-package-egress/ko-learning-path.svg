<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-label="AI가 허용된 패키지/레지스트리 프록시로 공개 소프트웨어를 학습하는 구조">
        <rect width="100%" height="100%" fill="#ffffff"/><defs>
          <filter id="koshadow0" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.16"/></filter>
          <marker id="koarrow0" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2157d6"/></marker>
          <marker id="koarrowRed0" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker>
        </defs>
        <rect x="32" y="48" width="190" height="90" rx="16" fill="#eaf1ff" stroke="#9bb8ff" filter="url(#koshadow0)"/>
        <text x="127" y="84" text-anchor="middle" font-size="18" font-weight="700" fill="#0f2449">AI Sandbox</text>
        <text x="127" y="112" text-anchor="middle" font-size="13" fill="#334155">인터넷 직접 차단</text>
        <path d="M222 93 H335" stroke="#2157d6" stroke-width="4" marker-end="url(#koarrow0)"/>
        <rect x="335" y="48" width="240" height="90" rx="16" fill="#fff7db" stroke="#f0c24d" filter="url(#koshadow0)"/>
        <text x="455" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="#7c4a03">허용된 패키지/레지스트리 프록시</text>
        <text x="455" y="111" text-anchor="middle" font-size="13" fill="#665200">Nexus / Artifactory / OCI cache</text>
        <path d="M575 93 H690" stroke="#2157d6" stroke-width="4" marker-end="url(#koarrow0)"/>
        <rect x="690" y="48" width="250" height="90" rx="16" fill="#ecfdf5" stroke="#86efac" filter="url(#koshadow0)"/>
        <text x="815" y="82" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">공개 패키지·컨테이너 생태계</text>
        <text x="815" y="111" text-anchor="middle" font-size="13" fill="#166534">Maven Central / Docker Hub / GHCR</text>
        <path d="M815 138 V218" stroke="#c2410c" stroke-width="4" marker-end="url(#koarrowRed0)"/>
        <rect x="655" y="218" width="320" height="118" rx="16" fill="#fee2e2" stroke="#ef8d8d" filter="url(#koshadow0)"/>
        <text x="815" y="256" text-anchor="middle" font-size="18" font-weight="700" fill="#991b1b">대상 제품 구조·바이너리 학습</text>
        <text x="815" y="284" text-anchor="middle" font-size="13" fill="#7f1d1d">POM/JAR → image layer → code index</text>
        <text x="815" y="307" text-anchor="middle" font-size="13" fill="#7f1d1d">proxy / redirect / cache / URL parsing 분석</text>
        <path d="M655 277 H510" stroke="#c2410c" stroke-width="4" marker-end="url(#koarrowRed0)"/>
        <rect x="255" y="218" width="255" height="118" rx="16" fill="#f8fafc" stroke="#d9dee8" filter="url(#koshadow0)"/>
        <text x="382" y="256" text-anchor="middle" font-size="18" font-weight="700" fill="#14213d">실제 프록시에 검증</text>
        <text x="382" y="284" text-anchor="middle" font-size="13" fill="#334155">응답 차이·버전 차이 확인</text>
        <text x="382" y="307" text-anchor="middle" font-size="13" fill="#334155">취약 경로 후보 축소</text>
      </svg>
